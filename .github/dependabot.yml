# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # conventional-changelog-conventionalcommits 10 verlangt conventional-changelog-writer@9;
      # semantic-release 25 bringt über @semantic-release/release-notes-generator aber @8 mit,
      # und der Release bräche in `generateNotes` („Missing helper"). Die KI-Notizen
      # (`scripts/release/ki-notizen.mjs`) erzeugen die konventionellen Notizen als Rückfall und
      # Kopfzeile bei jedem Release. Der Pin fällt, wenn semantic-release seinen Writer auf 9
      # hebt — dann von Hand. Gleicher Pin wie in rubenvitt/lifeline-hub.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
    groups:
      # React prüft zur Laufzeit, dass react und react-dom exakt gleich versioniert sind
      # („Incompatible React versions"). Einzeln gehobene PRs wären darum immer rot.
      react:
        patterns:
          - "react"
          - "react-dom"
