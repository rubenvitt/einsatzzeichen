name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prüft den Git-Index statt des Arbeitsbaums: lokale ignorierte Originale sind erlaubt,
      # eingecheckte Referenzassets sowie verletzte Paketgrenzen nicht.
      - name: Repository-Policy
        run: pnpm cli verify:repository

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm cli coverage

      - run: pnpm --filter @einsatzzeichen/website check
      - run: pnpm --filter @einsatzzeichen/website build
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: packages/website/dist
          retention-days: 14
