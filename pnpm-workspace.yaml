packages:
  - "packages/*"
allowBuilds:
  esbuild: true

overrides:
  # semantic-release-claude-changelog@2.0.0 (neueste) verlangt `^0.1.37` und bliebe damit auf
  # 0.1.x — mit einer Claude-CLI, die Workload Identity Federation nicht kennt. Der
  # Release-Job meldet sich aber per GitHub-OIDC an statt mit einem festen Schlüssel
  # (`.github/workflows/release.yml`, `scripts/release/ki-notizen.mjs`). Das Plugin ruft nur
  # `query({ prompt, options: { maxTurns } })` und liest `type`/`subtype`/`result`. Entfällt,
  # sobald das Plugin selbst eine Version mit Federation zulässt. Gleicher Stand wie in
  # rubenvitt/lifeline-hub.
  '@anthropic-ai/claude-agent-sdk': 0.3.296

packageExtensions:
  # `@astrojs/astro2tsx` (über `@astrojs/check`) bringt `@emnapi/core@1.11.3` mit, lässt die
  # passende `@emnapi/runtime` aber als Peer offen. Seit astro 7.4.7 zieht `rolldown` die Beta
  # `@emnapi/runtime@2.0.0-beta.2` herein, pnpm erfüllt den Peer damit, und `astro check` scheitert
  # beim Laden an der unpassenden Kombination (`this.bridge.setLastError is not a function`).
  # Die Runtime hier fest auf die Fassung des Kerns zu setzen hält beide zusammen. Entfällt, sobald
  # `@astrojs/astro2tsx` die Runtime selbst mitbringt oder auf `@emnapi/core@2` geht.
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
