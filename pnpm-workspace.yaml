packages:
  - "packages/*"
allowBuilds:
  esbuild: true

overrides:
  # semantic-release-claude-changelog@2.0.0 (neueste) verlangt `^0.1.37` und bliebe damit auf
  # 0.1.x — mit einer Claude-CLI, die Workload Identity Federation nicht kennt. Der
  # Release-Job meldet sich aber per GitHub-OIDC an statt mit einem festen Schlüssel
  # (`.github/workflows/release.yml`, `scripts/release/ki-notizen.mjs`). Das Plugin ruft nur
  # `query({ prompt, options: { maxTurns } })` und liest `type`/`subtype`/`result`. Entfällt,
  # sobald das Plugin selbst eine Version mit Federation zulässt. Gleicher Stand wie in
  # rubenvitt/lifeline-hub.
  '@anthropic-ai/claude-agent-sdk': 0.3.296
